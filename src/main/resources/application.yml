
spring:
  application:
    name: mianshikun
  # 默认 dev 环境
  profiles:
    active: dev
  # 支持 swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # session 配置
  session:
    # 30 天过期
    timeout: 2592000
  # 数据库配置
  # todo 需替换配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mianshiya
    username: root
    password: 123456789
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 连接池配置
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 监控
      filters: stat,wall
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: /druid/*
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: 123456
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8131
        port: 8719
      datasource:
        ds-flow:
          nacos:
            server-addr: 127.0.0.1:8848
            data-id: sentinel-flow-rules
            group-id: DEFAULT_GROUP
            data-type: json
            rule-type: flow
        ds-degrade:
          nacos:
            server-addr: 127.0.0.1:8848
            data-id: sentinel-degrade-rules
            group-id: DEFAULT_GROUP
            data-type: json
            rule-type: degrade
        ds-param-flow:
          nacos:
            server-addr: 127.0.0.1:8848
            data-id: sentinel-param-flow-rules
            group-id: DEFAULT_GROUP
            data-type: json
            rule-type: param-flow
  # Redis 配置
  # todo 需替换配置
  redis:
    database: 0
    host: localhost
    port: 6379
    timeout: 5000
  # Elasticsearch 配置
  # todo 需替换配置，然后取消注释
  elasticsearch:
    uris: http://localhost:9200
  # JD HotKey 热 key 探测
  hotkey:
    app-name: mianshikun
    etcd-server: http://127.0.0.1:2379
    caffeine-size: 10000
    push-period: 1000

  # 文件上传
  servlet:
    multipart:
      # 大小限制
      max-file-size: 10MB
server:
  address: 127.0.0.1
  port: 8101
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
nacos:
  config:
    server-addr: 127.0.0.1:8848
    bootstrap:
      enable: true
    data-id: mianshikun-blackList
    group: DEFAULT_GROUP
    type: yaml
    auto-refresh: true
# 对象存储
# todo 需替换配置
cos:
  client:
    accessKey: xxx
    secretKey: xxx
    region: xxx
    bucket: xxx
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.kun.mianshikun.controller

# JWT 配置
jwt:
  secret: mianshikun-jwt-secret-key-2024-change-in-production-environment
  access-token-expire: 900
  refresh-token-expire: 604800

logging:
  level:
    org.springframework.transaction: debug
    org.springframework.jdbc.datasource.DataSourceTransactionManager: debug
